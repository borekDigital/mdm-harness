# Prueft die Claude-Struktur bei jeder Aenderung an der Harness.
#
# Spec: .claude/specs/harness/claude-struktur-aktuell.md, Teil C.
# Was erlaubt ist, steht in bin/harness-referenz.json — nicht im Workflow.
#
# Die Kind-Repos werden hier nicht geklont. Rule-Globs, deren Verzeichnis
# fehlt, ueberspringt das Skript; sie prueft der lokale Stop-Hook.

name: Harness pruefen

on:
  push:
    paths:
      - ".claude/**"
      - ".mcp.json"
      - "templates/**"
      - "bin/harness-check.py"
      - "bin/harness-referenz.json"
      - "bin/test_harness_check.py"
      - "bin/harness-stand.py"
      - "bin/test_harness_stand.py"
      - "bin/test-waechter-hooks.sh"
      - "bin/befehl.py"
      - "bin/git-safety.py"
      - "bin/bauplan-guard.py"
      - "bin/test_befehl.py"
      - "workspace.yaml"
      - "docs/bauplan/**"
      - "sync.sh"
      - "git-hooks/**"
      - "bin/bauplan-index.py"
      - "bin/bauplan-nav.py"
      - "bin/bauplan_lib.py"
      - "bin/test_bauplan_index.py"
      - "bin/test_bauplan_nav.py"
      - "bin/test-sync-sauber.sh"
      - ".github/workflows/harness-check.yml"
  pull_request:
    paths:
      - ".claude/**"
      - ".mcp.json"
      - "templates/**"
      - "bin/harness-check.py"
      - "bin/harness-referenz.json"
      - "bin/test_harness_check.py"
      - "bin/harness-stand.py"
      - "bin/test_harness_stand.py"
      - "bin/test-waechter-hooks.sh"
      - "bin/befehl.py"
      - "bin/git-safety.py"
      - "bin/bauplan-guard.py"
      - "bin/test_befehl.py"
      - "workspace.yaml"
      - "docs/bauplan/**"
      - "sync.sh"
      - "git-hooks/**"
      - "bin/bauplan-index.py"
      - "bin/bauplan-nav.py"
      - "bin/bauplan_lib.py"
      - "bin/test_bauplan_index.py"
      - "bin/test_bauplan_nav.py"
      - "bin/test-sync-sauber.sh"
      - ".github/workflows/harness-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: |
          # jsonschema fuer die Settings-Validierung, die CLI fuer plugin validate.
          # Beides braucht kein Token.
          pip install --quiet jsonschema
          npm install -g @anthropic-ai/claude-code

      - name: Tests der Pruefskripte
        run: python3 -m unittest bin/test_harness_check.py bin/test_harness_stand.py bin/test_befehl.py bin/test_bauplan_index.py bin/test_bauplan_nav.py

      - name: Tests der Waechter-Hooks
        run: bash bin/test-waechter-hooks.sh

      - name: Tests sync.sh und post-merge
        run: bash bin/test-sync-sauber.sh

      - name: Bauplan-Uebersicht passt zum Stand
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          # Uebersicht und Fusszeilen sind generiert und versioniert. Aendert ein
          # PR Manifest, workspace.yaml oder Blattseiten, muss er sie mitbringen —
          # sync.sh erzeugt sie nach dem Pull nicht mehr (Spec bauplan-index-lokal-sauber).
          rc=0
          python3 bin/bauplan-index.py --check || rc=1
          python3 bin/bauplan-nav.py --check || rc=1
          exit $rc

      - name: Harness pruefen
        shell: bash
        run: |
          set +e
          python3 bin/harness-check.py | tee bericht.txt
          RC=${PIPESTATUS[0]}
          {
            echo "### Harness-Check"
            echo '```'
            cat bericht.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 = sauber, 3 = Befund, alles andere = Defekt. Beides ausser 0 ist rot.
          exit $RC
